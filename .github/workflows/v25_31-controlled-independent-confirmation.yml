name: TradeMind Pro V25.31 Controlled Independent Confirmation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  confirmation:
    name: V25.31 controlled independent confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify V25.31 script
        shell: bash
        run: |
          test -f .github/scripts/v25_31-controlled-independent-confirmation.js

      - name: Verify frozen V25.10 dataset
        shell: bash
        run: |
          test -f v25_10_learning_dataset.json

      - name: Verify V25.30 result
        shell: bash
        run: |
          test -f v25_30_controlled_hypothesis_evidence_resolution.json

      - name: Run V25.31 controlled independent confirmation
        run: |
          node .github/scripts/v25_31-controlled-independent-confirmation.js

      - name: Verify V25.31 result
        shell: bash
        run: |
          test -f v25_31_controlled_independent_confirmation.json

          node - <<'NODE'
          const fs = require("fs");

          const file =
            "v25_31_controlled_independent_confirmation.json";

          const result =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          if (
            result.status !==
            "CONTROLLED_INDEPENDENT_CONFIRMATION_COMPLETE"
          ) {
            throw new Error(
              "Unexpected V25.31 status."
            );
          }

          if (
            result.auditPass !== true
          ) {
            throw new Error(
              "V25.31 auditPass is not true."
            );
          }

          if (
            result.decision !==
            "NO_FEATURE_SELECTION"
          ) {
            throw new Error(
              "V25.31 feature-selection guard failed."
            );
          }

          if (
            result.protocol.outOfSample !==
            false
          ) {
            throw new Error(
              "V25.31 must not claim out-of-sample validation."
            );
          }

          console.log(
            "V25.31 verification PASS"
          );
          NODE

      - name: Print V25.31 summary
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const r =
            JSON.parse(
              fs.readFileSync(
                "v25_31_controlled_independent_confirmation.json",
                "utf8"
              )
            );

          console.log(
            "=== TRADEMIND PRO V25.31 ==="
          );

          console.log(
            r.status
          );

          console.log(
            `Frozen rows: ${r.source.rows}`
          );

          for (
            const feature
            of r.source.featuresReviewed
          ) {
            console.log(
              `${feature}: ${r.featureResults[feature].confirmation.status}`
            );
          }

          console.log(
            `Decision: ${r.decision}`
          );

          console.log(
            `OOS validation claimed: ${r.protocol.outOfSample}`
          );

          console.log(
            `Audit pass: ${r.auditPass}`
          );
          NODE

      - name: Upload V25.31 confirmation JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-31-controlled-independent-confirmation
          path: v25_31_controlled_independent_confirmation.json
          if-no-files-found: error
          retention-days: 90

      - name: Save V25.31 progress checkpoint
        shell: bash
        run: |
          mkdir -p .trademind-progress

          node - <<'NODE'
          const fs = require("fs");

          const result =
            JSON.parse(
              fs.readFileSync(
                "v25_31_controlled_independent_confirmation.json",
                "utf8"
              )
            );

          const checkpoint = {
            version: "V25.31",
            status:
              result.status,
            auditPass:
              result.auditPass,
            decision:
              result.decision,
            outOfSample:
              result.protocol.outOfSample,
            features:
              result.source.featuresReviewed,
            generatedAtUtc:
              new Date().toISOString()
          };

          fs.writeFileSync(
            ".trademind-progress/v25_31-progress-checkpoint.json",
            JSON.stringify(
              checkpoint,
              null,
              2
            )
          );
          NODE

      - name: Upload V25.31 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-31-progress-checkpoint
          path: .trademind-progress/v25_31-progress-checkpoint.json
          if-no-files-found: error
          retention-days: 90
