name: V25.27 Stable Evidence Feature Consolidation Research Eligibility Gate

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.7 full S5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-7-full_s5-import
          path: .
          repository: ${{ github.repository }}
          run-id: 31687848244
          github-token: ${{ github.token }}

      - name: Verify frozen V25.7 dataset
        run: |
          if [ ! -f v25_7_import.json ]; then
            echo "ERROR: v25_7_import.json was not found."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_7_import.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "IMPORT_COMPLETE":
              raise SystemExit("V25.7 dataset is not IMPORT_COMPLETE.")

          if data.get("mode") != "full_s5":
              raise SystemExit("V25.7 dataset is not full_s5.")

          if data.get("counts", {}).get("canonicalRows") != 9385:
              raise SystemExit("Unexpected V25.7 canonical row count.")

          integrity = data.get("integrity", {})

          if integrity.get("chronological") is not True:
              raise SystemExit("Chronological integrity failed.")

          if integrity.get("duplicateTimestamps") is not False:
              raise SystemExit("Duplicate timestamp guard failed.")

          if integrity.get("allOHLCValid") is not True:
              raise SystemExit("OHLC validity guard failed.")

          print("V25.7 frozen dataset verification: PASS")
          PY

      - name: Rebuild frozen V25.10 learning dataset
        run: |
          node .github/scripts/v25_10-learning-dataset-freeze.js

      - name: Verify frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not generated."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          dataset = data.get("learningDataset", {})

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("V25.10 freeze did not complete.")

          if dataset.get("frozen") is not True:
              raise SystemExit("V25.10 frozen flag is not true.")

          if dataset.get("rowCount") != 7791:
              raise SystemExit("Unexpected V25.10 row count.")

          if dataset.get("featureCount") != 19:
              raise SystemExit("Unexpected V25.10 feature count.")

          print("V25.10 frozen dataset verification: PASS")
          print("Rows:", dataset.get("rowCount"))
          print("Features:", dataset.get("featureCount"))
          print("SHA256:", dataset.get("sha256"))
          PY

      - name: Recreate V25.18 mathematical identity evidence
        run: |
          node .github/scripts/v25_18-stable-evidence-mathematical-identity-audit.js

      - name: Recreate V25.19 volatility conditioning evidence
        run: |
          node .github/scripts/v25_19-stable-evidence-volatility-conditioning-audit.js

      - name: Recreate V25.20 persistence evidence
        run: |
          if [ -f .github/scripts/v25_20-stable-evidence-volatility-conditioning-persistence-audit.js ]; then
            node .github/scripts/v25_20-stable-evidence-volatility-conditioning-persistence-audit.js
          else
            echo "V25.20 script not present in repository."
            exit 1
          fi

      - name: Recreate V25.21 magnitude evidence
        run: |
          if [ -f .github/scripts/v25_21-stable-evidence-volatility-conditioning-magnitude-audit.js ]; then
            node .github/scripts/v25_21-stable-evidence-volatility-conditioning-magnitude-audit.js
          else
            echo "V25.21 script not present in repository."
            exit 1
          fi

      - name: Recreate V25.22 ATR decomposition evidence
        run: |
          if [ -f .github/scripts/v25_22-stable-evidence-atr-normalization-decomposition-audit.js ]; then
            node .github/scripts/v25_22-stable-evidence-atr-normalization-decomposition-audit.js
          else
            echo "V25.22 script not present in repository."
            exit 1
          fi

      - name: Recreate V25.23 extreme ATR tail evidence
        run: |
          if [ -f .github/scripts/v25_23-stable-evidence-extreme-atr-tail-integrity-audit.js ]; then
            node .github/scripts/v25_23-stable-evidence-extreme-atr-tail-integrity-audit.js
          else
            echo "V25.23 script not present in repository."
            exit 1
          fi

      - name: Recreate V25.24 direction consistency evidence
        run: |
          node .github/scripts/v25_24-stable-evidence-atr-normalization-direction-consistency-audit.js

      - name: Recreate V25.25 HIGH-Q4 temporal concentration evidence
        run: |
          node .github/scripts/v25_25-stable-evidence-high-q4-temporal-concentration-audit.js

      - name: Recreate V25.26 HIGH-Q4 regime-state evidence
        run: |
          node .github/scripts/v25_26-stable-evidence-high-q4-regime-state-attribution-audit.js

      - name: Run V25.27 evidence consolidation gate
        run: |
          node .github/scripts/v25_27-stable-evidence-feature-consolidation-research-eligibility-gate.js

      - name: Print V25.27 gate result
        run: |
          node - <<'NODE'
          const r = require(
            './v25_27_stable_evidence_feature_consolidation_selection_gate.json'
          );

          console.log(JSON.stringify({
            status: r.status,
            auditPass: r.auditPass,
            evidenceCompleteness: r.evidenceChain.completeness,
            gateDecision: r.gateDecision,
            nextStage: r.nextStage,
            guards: r.guards
          }, null, 2));
          NODE

      - name: Verify V25.27 gate
        run: |
          node - <<'NODE'
          const r = require(
            './v25_27_stable_evidence_feature_consolidation_selection_gate.json'
          );

          if (!r.success || !r.auditPass) {
            throw new Error("V25.27 gate did not pass.");
          }

          if (
            r.version !==
            "V25.27-STABLE-EVIDENCE-FEATURE-CONSOLIDATION-RESEARCH-ELIGIBILITY-GATE"
          ) {
            throw new Error("Unexpected V25.27 version.");
          }

          if (r.source.datasetRows !== 7791) {
            throw new Error("Unexpected dataset row count.");
          }

          if (r.source.featureCount !== 19) {
            throw new Error("Unexpected feature count.");
          }

          if (r.source.datasetFrozen !== true) {
            throw new Error("Dataset is not frozen.");
          }

          if (
            r.evidenceChain.completeness.complete !== true ||
            r.evidenceChain.completeness.completedAuditCount !== 9
          ) {
            throw new Error("V25.18-V25.26 evidence chain is incomplete.");
          }

          if (
            r.gateDecision.overallEvidenceStatus !== "PASS"
          ) {
            throw new Error("Overall evidence gate did not PASS.");
          }

          if (
            r.gateDecision.emaSpread !== "PASS"
          ) {
            throw new Error("emaSpread eligibility gate failed.");
          }

          if (
            r.gateDecision.emaSpreadATR !==
            "PASS_WITH_DEPENDENCY_GUARD"
          ) {
            throw new Error("emaSpreadATR dependency gate failed.");
          }

          if (
            r.policy.sourceFrozen !== true ||
            r.policy.datasetModified !== false ||
            r.policy.featureEngineering !== false ||
            r.policy.featureSelection !== false ||
            r.policy.candidateDiscovery !== false ||
            r.policy.strategyDiscovery !== false ||
            r.policy.optimization !== false ||
            r.policy.modelFitting !== false ||
            r.policy.strategyValidation !== false ||
            r.policy.strategyModified !== false ||
            r.policy.realOrders !== false
          ) {
            throw new Error("V25.27 policy guard failed.");
          }

          if (
            r.guards.featureSelection !== false ||
            r.guards.optimization !== false ||
            r.guards.modelFitting !== false ||
            r.guards.validation !== false ||
            r.guards.strategyModified !== false ||
            r.guards.realOrders !== false
          ) {
            throw new Error("V25.27 research-scope guard failed.");
          }

          console.log("V25.27 evidence gate verification PASS");
          NODE

      - name: Upload V25.27 evidence gate JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-27-stable-evidence-feature-consolidation-research-eligibility-gate
          path: v25_27_stable_evidence_feature_consolidation_selection_gate.json
          if-no-files-found: error

      - name: Save V25.27 progress checkpoint
        run: |
          cat > v25_27_progress_checkpoint.json <<'EOF'
          {
            "project": "TradeMind Pro",
            "stage": "V25.27",
            "status": "FEATURE_EVIDENCE_CONSOLIDATION_GATE_COMPLETE",
            "source": "v25_10_learning_dataset.json rebuilt from frozen V25.7 full_s5 artifact",
            "sourceFrozen": true,
            "datasetModified": false,
            "datasetRows": 7791,
            "featureCount": 19,
            "paperOnly": true,
            "realOrders": false,
            "featureEngineering": false,
            "featureSelection": false,
            "optimization": false,
            "modelFitting": false,
            "validation": false,
            "oos": false,
            "strategyModified": false,
            "evidenceChain": [
              "V25.18",
              "V25.19",
              "V25.20",
              "V25.21",
              "V25.22",
              "V25.23",
              "V25.24",
              "V25.25",
              "V25.26"
            ],
            "gateMeaning": "Eligibility for controlled downstream research only; not feature selection, superiority, profitability, causality, or strategy validity.",
            "emaSpreadEligibility": "PASS",
            "emaSpreadATREligibility": "PASS_WITH_DEPENDENCY_GUARD",
            "nextStage": "CONTROLLED_DOWNSTREAM_FEATURE_RESEARCH"
          }
          EOF

      - name: Upload V25.27 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-27-progress-checkpoint
          path: v25_27_progress_checkpoint.json
          if-no-files-found: error
