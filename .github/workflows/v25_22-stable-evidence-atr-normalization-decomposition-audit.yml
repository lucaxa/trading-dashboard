name: V25.22 Stable Evidence ATR Normalization Decomposition Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # V25.10 artifact is no longer the reliable dependency.
      # Reconstruct the frozen V25.10 dataset from the still-valid
      # V25.7 frozen full_s5 artifact using the existing V25.10 freeze script.
      - name: Download frozen V25.7 full S5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-7-full_s5-import
          path: .
          repository: ${{ github.repository }}
          run-id: 31687848244
          github-token: ${{ github.token }}

      - name: Verify frozen V25.7 dataset
        run: |
          if [ ! -f v25_7_import.json ]; then
            echo "ERROR: v25_7_import.json was not found."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_7_import.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "IMPORT_COMPLETE":
              raise SystemExit("Frozen V25.7 dataset is not IMPORT_COMPLETE.")

          if data.get("mode") != "full_s5":
              raise SystemExit("Frozen V25.7 dataset is not full_s5.")

          if data.get("counts", {}).get("canonicalRows") != 9385:
              raise SystemExit("Frozen V25.7 canonical row count is not 9385.")

          integrity = data.get("integrity", {})

          if integrity.get("chronological") is not True:
              raise SystemExit("Frozen V25.7 dataset failed chronological check.")

          if integrity.get("duplicateTimestamps") is not False:
              raise SystemExit("Frozen V25.7 dataset contains duplicate timestamps.")

          if integrity.get("allOHLCValid") is not True:
              raise SystemExit("Frozen V25.7 dataset contains invalid OHLC.")

          print("V25.7 frozen dataset verification: PASS")
          PY

      - name: Rebuild frozen V25.10 learning dataset
        run: |
          node .github/scripts/v25_10-learning-dataset-freeze.js

      - name: Verify rebuilt frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: V25.10 dataset was not generated."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          dataset = data.get("learningDataset", {})
          audit = data.get("learningRecordAudit", {})
          guard = data.get("guard", {})

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("V25.10 dataset freeze did not complete.")

          if dataset.get("frozen") is not True:
              raise SystemExit("V25.10 dataset frozen flag is not true.")

          if dataset.get("rowCount") != 7791:
              raise SystemExit(
                  f"Unexpected V25.10 dataset row count: {dataset.get('rowCount')}"
              )

          if dataset.get("featureCount") != 19:
              raise SystemExit(
                  f"Unexpected V25.10 feature count: {dataset.get('featureCount')}"
              )

          if audit.get("datasetInvalidRows") != 0:
              raise SystemExit("V25.10 contains invalid dataset rows.")

          if audit.get("datasetDuplicateRows") != 0:
              raise SystemExit("V25.10 contains duplicate dataset rows.")

          if guard.get("learningEngineCalled") is not False:
              raise SystemExit("Learning engine was called unexpectedly.")

          if guard.get("candidateDiscovery") is not False:
              raise SystemExit("Candidate discovery was enabled unexpectedly.")

          if guard.get("validation") is not False:
              raise SystemExit("Validation was enabled unexpectedly.")

          if guard.get("oos") is not False:
              raise SystemExit("OOS testing was enabled unexpectedly.")

          if guard.get("strategyModified") is not False:
              raise SystemExit("Strategy modification was enabled unexpectedly.")

          if guard.get("realOrders") is not False:
              raise SystemExit("Real orders flag is not false.")

          print("V25.10 rebuilt frozen dataset verification: PASS")
          print("Rows:", dataset.get("rowCount"))
          print("Features:", dataset.get("featureCount"))
          print("SHA256:", dataset.get("sha256"))
          PY

      - name: Run V25.22 ATR normalization decomposition audit
        run: |
          node .github/scripts/v25_22-stable-evidence-atr-normalization-decomposition-audit.js

      - name: Print V25.22 decomposition summary
        run: |
          node -e "const r=require('./v25_22_stable_evidence_atr_normalization_decomposition_audit.json'); console.log(JSON.stringify({status:r.status,auditPass:r.auditPass,internalThresholds:r.methodology.internalThresholds,overallHighVolatility:r.overallHighVolatility.outcomePearson,blocks:r.chronologicalBlocks.map(b=>({block:b.block,highOverall:b.decomposition.highOverall.outcomePearson,subRegimes:b.decomposition.subRegimes.map(x=>({regime:x.regime,pearson:x.analysis.outcomePearson}))}))},null,2))"

      - name: Verify V25.22 audit result
        run: |
          node -e "const r=require('./v25_22_stable_evidence_atr_normalization_decomposition_audit.json'); if(!r.success || !r.auditPass || !r.interpretation.constantScalingCannotChangePearson || !r.interpretation.withinSubRegimeComparisonPerformed) process.exit(1); console.log('V25.22 audit verification PASS')"

      - name: Upload V25.22 decomposition JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-22-stable-evidence-atr-normalization-decomposition-audit
          path: v25_22_stable_evidence_atr_normalization_decomposition_audit.json
          if-no-files-found: error

      - name: Save V25.22 progress checkpoint
        run: |
          cat > v25_22_progress_checkpoint.json <<'EOF'
          {
            "project": "TradeMind Pro",
            "stage": "V25.22",
            "status": "ATR_NORMALIZATION_DECOMPOSITION_AUDIT",
            "source": "v25_10_learning_dataset.json rebuilt from frozen V25.7 full_s5 artifact",
            "sourceFrozen": true,
            "datasetModified": false,
            "strategyModified": false,
            "realOrders": false,
            "nextDecision": "Inspect HIGH_Q1..HIGH_Q4 Pearson divergence before any feature-selection or strategy work."
          }
          EOF

      - name: Upload V25.22 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-22-progress-checkpoint
          path: v25_22_progress_checkpoint.json
          if-no-files-found: error
