name: V25.8.1 Feature Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.7 full S5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts"

          req = urllib.request.Request(
              api,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          matches = [
              a for a in data.get("artifacts", [])
              if a.get("name") == "v25-7-full_s5-import"
              and not a.get("expired")
          ]

          if not matches:
              raise SystemExit("Frozen V25.7 full S5 artifact not found.")

          artifact = matches[0]

          download_url = artifact["archive_download_url"]

          req = urllib.request.Request(
              download_url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(req) as r:
              content = r.read()

          open("v25_7_artifact.zip", "wb").write(content)

          print("Downloaded artifact:")
          print(artifact["name"])
          print("Artifact ID:", artifact["id"])
          PY

          unzip -o v25_7_artifact.zip

      - name: Run V25.8.1 feature diagnostic
        run: |
          node .github/scripts/v25_8_1-feature-diagnostic.js

      - name: Print V25.8.1 diagnostic summary
        run: |
          if [ -f v25_8_1_feature_diagnostic.json ]; then
            cat v25_8_1_feature_diagnostic.json
          else
            echo "Diagnostic JSON was not generated."
            exit 1
          fi

      - name: Upload V25.8.1 diagnostic JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-8-1-feature-diagnostic
          path: v25_8_1_feature_diagnostic.json
          if-no-files-found: error
