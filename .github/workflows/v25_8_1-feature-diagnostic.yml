name: V25.8.1 Feature Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.7 full S5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-7-full_s5-import
          path: .
          repository: ${{ github.repository }}
          run-id: 31687848244
          github-token: ${{ github.token }}

      - name: Verify frozen V25.7 dataset
        run: |
          echo "Checking frozen V25.7 artifact..."

          if [ ! -f v25_7_import.json ]; then
            echo "ERROR: v25_7_import.json was not found."
            echo "Files present:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Frozen V25.7 dataset found."
          echo "File size:"
          wc -c v25_7_import.json

          echo "Dataset header:"
          python3 - <<'PY'
          import json

          with open("v25_7_import.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "mode": data.get("mode"),
              "canonicalRows": data.get("counts", {}).get("canonicalRows"),
              "integrity": data.get("integrity")
          }, indent=2))

          if data.get("status") != "IMPORT_COMPLETE":
              raise SystemExit("Frozen V25.7 dataset is not IMPORT_COMPLETE.")

          if data.get("mode") != "full_s5":
              raise SystemExit("Frozen dataset is not full_s5.")

          if data.get("counts", {}).get("canonicalRows") != 9385:
              raise SystemExit(
                  f"Unexpected canonical row count: "
                  f"{data.get('counts', {}).get('canonicalRows')}"
              )

          if data.get("integrity", {}).get("chronological") is not True:
              raise SystemExit("Frozen dataset failed chronological integrity check.")

          if data.get("integrity", {}).get("duplicateTimestamps") is not False:
              raise SystemExit("Frozen dataset contains duplicate timestamps.")

          if data.get("integrity", {}).get("allOHLCValid") is not True:
              raise SystemExit("Frozen dataset contains invalid OHLC rows.")

          print("V25.7 frozen dataset verification: PASS")
          PY

      - name: Run V25.8.1 feature diagnostic
        run: |
          node .github/scripts/v25_8_1-feature-diagnostic.js

      - name: Print V25.8.1 diagnostic summary
        run: |
          if [ -f v25_8_1_feature_diagnostic.json ]; then
            cat v25_8_1_feature_diagnostic.json
          else
            echo "Diagnostic JSON was not generated."
            exit 1
          fi

      - name: Upload V25.8.1 diagnostic JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-8-1-feature-diagnostic
          path: v25_8_1_feature_diagnostic.json
          if-no-files-found: error
