name: V25.15 Feature Redundancy Stability Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps({
              "status": data.get("status"),
              "frozen": data.get("learningDataset", {}).get("frozen"),
              "datasetRows": len(data.get("learningDataset", {}).get("records", [])),
              "featureCount": data.get("learningDataset", {}).get("featureCount")
          }, indent=2))

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("Frozen V25.10 dataset status is invalid.")

          if data.get("learningDataset", {}).get("frozen") is not True:
              raise SystemExit("Frozen V25.10 dataset is not marked frozen.")

          if len(data.get("learningDataset", {}).get("records", [])) != 7791:
              raise SystemExit("Unexpected V25.10 dataset row count.")

          if data.get("learningDataset", {}).get("featureCount") != 19:
              raise SystemExit("Unexpected V25.10 feature count.")

          print("V25.10 frozen learning dataset verification: PASS")
          PY

      - name: Run V25.15 feature redundancy stability audit
        run: |
          node .github/scripts/v25_15-feature-redundancy-stability-audit.js

      - name: Print V25.15 stability audit summary
        run: |
          if [ -f v25_15_feature_redundancy_stability_audit.json ]; then
            cat v25_15_feature_redundancy_stability_audit.json
          else
            echo "V25.15 stability audit JSON was not generated."
            exit 1
          fi

      - name: Verify V25.15 audit result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_15_feature_redundancy_stability_audit.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          counts = data.get("counts", {})
          verdict = data.get("verdict", {})

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "datasetRows": data.get("source", {}).get("datasetRows"),
              "featureCount": data.get("source", {}).get("featureCount"),
              "pairCount": data.get("pairCount"),
              "persistentNearDuplicatePairs": counts.get("persistentNearDuplicatePairs"),
              "persistentStrongRedundancyPairs": counts.get("persistentStrongRedundancyPairs"),
              "localizedStrongRedundancyPairs": counts.get("localizedStrongRedundancyPairs"),
              "lostStrongByLatePairs": counts.get("lostStrongByLatePairs"),
              "emergedStrongLatePairs": counts.get("emergedStrongLatePairs"),
              "signStablePairs": counts.get("signStablePairs"),
              "signUnstablePairs": counts.get("signUnstablePairs"),
              "auditPass": verdict.get("auditPass"),
              "descriptiveOnly": verdict.get("descriptiveOnly"),
              "noFeatureSelection": verdict.get("noFeatureSelection"),
              "noOptimization": verdict.get("noOptimization"),
              "noCandidateDiscovery": verdict.get("noCandidateDiscovery"),
              "noStrategyModification": verdict.get("noStrategyModification")
          }, indent=2))

          if data.get("status") != "REDUNDANCY_STABILITY_AUDIT_COMPLETE":
              raise SystemExit("V25.15 redundancy stability audit did not complete.")

          for key in [
              "auditPass",
              "descriptiveOnly",
              "noFeatureSelection",
              "noOptimization",
              "noCandidateDiscovery",
              "noStrategyModification",
              "noRealOrders"
          ]:
              if verdict.get(key) is not True:
                  raise SystemExit(f"V25.15 guard/verdict failed: {key}")

          print("V25.15 feature redundancy stability audit: PASS")
          PY

      - name: Upload V25.15 stability audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-15-feature-redundancy-stability-audit
          path: v25_15_feature_redundancy_stability_audit.json
          if-no-files-found: error
