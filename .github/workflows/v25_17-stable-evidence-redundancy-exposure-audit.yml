name: V25.17 Stable Evidence Redundancy Exposure Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          records = data.get("learningDataset", {}).get("records", [])

          print(json.dumps({
              "status": data.get("status"),
              "frozen": data.get("learningDataset", {}).get("frozen"),
              "datasetRows": len(records),
              "featureCount": data.get("learningDataset", {}).get("featureCount")
          }, indent=2))

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("Frozen V25.10 dataset status is invalid.")

          if data.get("learningDataset", {}).get("frozen") is not True:
              raise SystemExit("Frozen V25.10 dataset is not marked frozen.")

          if len(records) != 7791:
              raise SystemExit("Unexpected V25.10 dataset row count.")

          if data.get("learningDataset", {}).get("featureCount") != 19:
              raise SystemExit("Unexpected V25.10 feature count.")

          print("V25.10 frozen learning dataset verification: PASS")
          PY

      - name: Run V25.17 stable evidence redundancy exposure audit
        run: |
          node .github/scripts/v25_17-stable-evidence-redundancy-exposure-audit.js

      - name: Print V25.17 exposure audit summary
        run: |
          if [ -f v25_17_stable_evidence_redundancy_exposure_audit.json ]; then
            cat v25_17_stable_evidence_redundancy_exposure_audit.json
          else
            echo "V25.17 output JSON was not generated."
            exit 1
          fi

      - name: Verify V25.17 audit result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_17_stable_evidence_redundancy_exposure_audit.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          counts = data.get("counts", {})
          exposure = data.get("stableEvidenceExposure", {})
          guards = data.get("guards", {})

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "datasetRows": data.get("source", {}).get("datasetRows"),
              "featureCount": data.get("source", {}).get("featureCount"),
              "totalFeaturePairs": counts.get("totalFeaturePairs"),
              "persistentStrongRedundancyPairs": counts.get("persistentStrongRedundancyPairs"),
              "persistentNearDuplicatePairs": counts.get("persistentNearDuplicatePairs"),
              "stableEvidenceFeatures": exposure.get("stableEvidenceFeatures"),
              "exposedToPersistentStrongRedundancy": exposure.get("exposedToPersistentStrongRedundancy"),
              "stableEvidenceFeaturesWithoutPersistentStrongRedundancy": exposure.get("stableEvidenceFeaturesWithoutPersistentStrongRedundancy"),
              "auditPass": data.get("auditPass")
          }, indent=2))

          if data.get("status") != "REDUNDANCY_EXPOSURE_AUDIT_COMPLETE":
              raise SystemExit("V25.17 redundancy exposure audit did not complete.")

          if data.get("auditPass") is not True:
              raise SystemExit("V25.17 auditPass is not true.")

          for key in [
              "learningEngineCalled",
              "candidateDiscovery",
              "featureSelection",
              "modelFitting",
              "validation",
              "oos",
              "strategyModified",
              "realOrders"
          ]:
              if guards.get(key) is not False:
                  raise SystemExit(f"V25.17 guard failed: {key}")

          print("V25.17 stable evidence redundancy exposure audit: PASS")
          PY

      - name: Upload V25.17 exposure audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-17-stable-evidence-redundancy-exposure-audit
          path: v25_17_stable_evidence_redundancy_exposure_audit.json
          if-no-files-found: error
