name: V25.16 Feature Evidence Redundancy Consolidation

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          echo "Checking frozen V25.10 learning dataset..."

          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          records = data.get("learningDataset", {}).get("records", [])

          print(json.dumps({
              "status": data.get("status"),
              "frozen": data.get("learningDataset", {}).get("frozen"),
              "rows": len(records),
              "featureCount": data.get("learningDataset", {}).get("featureCount")
          }, indent=2))

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("Dataset is not DATASET_FREEZE_COMPLETE.")

          if data.get("learningDataset", {}).get("frozen") is not True:
              raise SystemExit("Dataset is not marked frozen.")

          if len(records) != 7791:
              raise SystemExit(f"Unexpected row count: {len(records)}")

          if data.get("learningDataset", {}).get("featureCount") != 19:
              raise SystemExit("Unexpected feature count.")

          print("V25.10 frozen learning dataset verification: PASS")
          PY

      - name: Run V25.16 feature evidence redundancy consolidation
        run: |
          node .github/scripts/v25_16-feature-evidence-redundancy-consolidation.js

      - name: Print V25.16 consolidation summary
        run: |
          if [ -f v25_16_feature_evidence_redundancy_consolidation.json ]; then
            cat v25_16_feature_evidence_redundancy_consolidation.json
          else
            echo "V25.16 output JSON was not generated."
            exit 1
          fi

      - name: Upload V25.16 consolidation JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-16-feature-evidence-redundancy-consolidation
          path: v25_16_feature_evidence_redundancy_consolidation.json
          if-no-files-found: error
