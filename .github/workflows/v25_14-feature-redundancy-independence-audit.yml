name: V25.14 Feature Redundancy Independence Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Frozen V25.10 learning dataset found."
          wc -c v25_10_learning_dataset.json

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps({
              "status": data.get("status"),
              "frozen": data.get("learningDataset", {}).get("frozen"),
              "datasetRows": len(data.get("learningDataset", {}).get("records", [])),
              "featureCount": data.get("learningDataset", {}).get("featureCount")
          }, indent=2))

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("Frozen V25.10 dataset status is invalid.")

          if data.get("learningDataset", {}).get("frozen") is not True:
              raise SystemExit("Frozen V25.10 dataset is not marked frozen.")

          if len(data.get("learningDataset", {}).get("records", [])) != 7791:
              raise SystemExit("Unexpected V25.10 dataset row count.")

          if data.get("learningDataset", {}).get("featureCount") != 19:
              raise SystemExit("Unexpected V25.10 feature count.")

          print("V25.10 frozen learning dataset verification: PASS")
          PY

      - name: Run V25.14 feature redundancy independence audit
        run: |
          node .github/scripts/v25_14-feature-redundancy-independence-audit.js

      - name: Print V25.14 redundancy audit summary
        run: |
          if [ -f v25_14_feature_redundancy_independence_audit.json ]; then
            cat v25_14_feature_redundancy_independence_audit.json
          else
            echo "V25.14 redundancy audit JSON was not generated."
            exit 1
          fi

      - name: Verify V25.14 audit result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_14_feature_redundancy_independence_audit.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "datasetRows": data.get("source", {}).get("datasetRows"),
              "featureCount": data.get("source", {}).get("featureCount"),
              "pairCount": data.get("pairCount"),
              "nearDuplicatePairs": len(data.get("nearDuplicatePairs", [])),
              "strongRedundancyPairs": len(data.get("strongRedundancyPairs", [])),
              "redundancyGroups": len(data.get("redundancyGroups", [])),
              "independentSingletons": len(data.get("independentSingletons", [])),
              "auditPass": data.get("verdict", {}).get("auditPass"),
              "descriptiveOnly": data.get("verdict", {}).get("descriptiveOnly"),
              "noFeatureSelection": data.get("verdict", {}).get("noFeatureSelection"),
              "noOptimization": data.get("verdict", {}).get("noOptimization"),
              "noCandidateDiscovery": data.get("verdict", {}).get("noCandidateDiscovery"),
              "noStrategyModification": data.get("verdict", {}).get("noStrategyModification")
          }, indent=2))

          if data.get("status") != "REDUNDANCY_AUDIT_COMPLETE":
              raise SystemExit("V25.14 redundancy audit did not complete.")

          verdict = data.get("verdict", {})

          for key in [
              "auditPass",
              "descriptiveOnly",
              "noFeatureSelection",
              "noOptimization",
              "noCandidateDiscovery",
              "noStrategyModification",
              "noRealOrders"
          ]:
              if verdict.get(key) is not True:
                  raise SystemExit(f"V25.14 guard/verdict failed: {key}")

          print("V25.14 feature redundancy independence audit: PASS")
          PY

      - name: Upload V25.14 redundancy audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-14-feature-redundancy-independence-audit
          path: v25_14_feature_redundancy_independence_audit.json
          if-no-files-found: error
