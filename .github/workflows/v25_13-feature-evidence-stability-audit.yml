name: V25.13 Feature Evidence Stability Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Frozen V25.10 learning dataset found."
          wc -c v25_10_learning_dataset.json

      - name: Run V25.13 feature evidence stability audit
        run: |
          node .github/scripts/v25_13-feature-evidence-stability-audit.js

      - name: Print V25.13 stability audit summary
        run: |
          if [ -f v25_13_feature_evidence_stability_audit.json ]; then
            cat v25_13_feature_evidence_stability_audit.json
          else
            echo "V25.13 stability audit JSON was not generated."
            exit 1
          fi

      - name: Verify V25.13 audit result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_13_feature_evidence_stability_audit.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "datasetRows": data.get("source", {}).get("datasetRows"),
              "featureCount": data.get("source", {}).get("featureCount"),
              "trimFractionEachTail": data.get("source", {}).get("trimFractionEachTail"),
              "auditPass": data.get("verdict", {}).get("auditPass"),
              "descriptiveOnly": data.get("verdict", {}).get("descriptiveOnly"),
              "noOptimization": data.get("verdict", {}).get("noOptimization"),
              "noCandidateDiscovery": data.get("verdict", {}).get("noCandidateDiscovery"),
              "noStrategyModification": data.get("verdict", {}).get("noStrategyModification")
          }, indent=2))

          if data.get("status") != "STABILITY_AUDIT_COMPLETE":
              raise SystemExit(
                  "V25.13 stability audit did not complete."
              )

          verdict = data.get("verdict", {})

          for key in [
              "auditPass",
              "descriptiveOnly",
              "noOptimization",
              "noCandidateDiscovery",
              "noStrategyModification"
          ]:
              if verdict.get(key) is not True:
                  raise SystemExit(
                      f"V25.13 guard/verdict failed: {key}"
                  )

          print("V25.13 feature evidence stability audit: PASS")
          PY

      - name: Upload V25.13 stability audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-13-feature-evidence-stability-audit
          path: v25_13_feature_evidence_stability_audit.json
          if-no-files-found: error
