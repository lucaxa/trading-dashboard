name: TradeMind Pro V25.30 Controlled Hypothesis Evidence Resolution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: V25.30 controlled hypothesis evidence resolution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify V25.30 script
        shell: bash
        run: |
          test -f .github/scripts/v25_30-controlled-hypothesis-evidence-resolution.js

      - name: Verify frozen V25.10 dataset
        shell: bash
        run: |
          test -f v25_10_learning_dataset.json

      - name: Run V25.30 controlled hypothesis evidence resolution
        run: |
          node .github/scripts/v25_30-controlled-hypothesis-evidence-resolution.js

      - name: Verify V25.30 result
        shell: bash
        run: |
          test -f v25_30_controlled_hypothesis_evidence_resolution.json
          node - <<'NODE'
          const fs = require('fs');
          const f = 'v25_30_controlled_hypothesis_evidence_resolution.json';
          const r = JSON.parse(fs.readFileSync(f, 'utf8'));

          if (r.success !== true) throw new Error('V25.30 success flag is not true.');
          if (r.version !== 'V25.30-CONTROLLED-HYPOTHESIS-EVIDENCE-RESOLUTION') {
            throw new Error('Unexpected V25.30 version.');
          }
          if (r.auditPass !== true) throw new Error('V25.30 auditPass is not true.');
          if (r.paperOnly !== true) throw new Error('V25.30 paperOnly guard failed.');
          if (r.realOrders !== false) throw new Error('V25.30 realOrders guard failed.');
          if (r.policy.sourceFrozen !== true) throw new Error('Frozen-source guard failed.');
          if (r.policy.featureSelection !== false) throw new Error('Feature-selection guard failed.');
          if (r.policy.optimization !== false) throw new Error('Optimization guard failed.');
          if (r.policy.modelFitting !== false) throw new Error('Model-fitting guard failed.');
          if (r.policy.strategyModified !== false) throw new Error('Strategy-modification guard failed.');
          if (r.guards.learningEngineCalled !== false) throw new Error('Learning-engine guard failed.');
          if (r.hypotheses.length !== 7) throw new Error('Expected seven hypotheses.');
          NODE

      - name: Print V25.30 summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(
            'v25_30_controlled_hypothesis_evidence_resolution.json',
            'utf8'
          ));

          console.log('=== TRADEMIND PRO V25.30 ===');
          console.log(r.status);
          console.log('Decision:', r.researchConclusion.decision);
          console.log('Hypotheses:');
          for (const h of r.hypotheses) {
            console.log(`${h.id}: ${h.status}`);
          }
          console.log('Audit pass:', r.auditPass);
          NODE

      - name: Upload V25.30 evidence-resolution JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-30-controlled-hypothesis-evidence-resolution
          path: v25_30_controlled_hypothesis_evidence_resolution.json
          if-no-files-found: error
          retention-days: 90

      - name: Save V25.30 progress checkpoint
        shell: bash
        run: |
          cat > v25_30_progress_checkpoint.json <<'JSON'
          {
            "version": "V25.30",
            "status": "CONTROLLED_HYPOTHESIS_EVIDENCE_RESOLUTION_COMPLETE",
            "sourceFrozen": true,
            "featureSelection": false,
            "optimization": false,
            "modelFitting": false,
            "strategyModified": false,
            "realOrders": false,
            "nextStage": "HUMAN_REVIEW_BEFORE_ANY_NEW_RESEARCH_PROTOCOL"
          }
          JSON

      - name: Upload V25.30 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-30-progress-checkpoint
          path: v25_30_progress_checkpoint.json
          if-no-files-found: error
          retention-days: 90
