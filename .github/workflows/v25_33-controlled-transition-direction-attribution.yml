name: V25.33 Controlled Transition Direction Attribution

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    name: V25.33 controlled transition direction attribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify V25.33 script
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/v25_33-controlled-transition-direction-attribution.js

      # ----------------------------------------------------------
      # DO NOT call the GitHub Actions artifacts REST endpoint
      # from Python here.
      #
      # The previous V25.33 workflow failed with HTTP 401 while
      # following the temporary artifact-download redirect.
      #
      # Instead, deterministically recreate V25.10 and V25.32
      # from the same frozen V25.7 S5 artifact used by V25.32.
      # ----------------------------------------------------------

      - name: Download frozen V25.7 full S5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-7-full_s5-import
          path: .
          repository: ${{ github.repository }}
          run-id: 31687848244
          github-token: ${{ github.token }}

      - name: Verify frozen V25.7 dataset
        shell: bash
        run: |
          set -euo pipefail

          test -f v25_7_import.json

          python3 - <<'PY'
          import json

          with open("v25_7_import.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "IMPORT_COMPLETE":
              raise SystemExit("V25.7 dataset is not IMPORT_COMPLETE.")

          if data.get("mode") != "full_s5":
              raise SystemExit("V25.7 dataset is not full_s5.")

          if data.get("counts", {}).get("canonicalRows") != 9385:
              raise SystemExit("Unexpected V25.7 canonical row count.")

          integrity = data.get("integrity", {})

          if integrity.get("chronological") is not True:
              raise SystemExit("Chronological integrity failed.")

          if integrity.get("duplicateTimestamps") is not False:
              raise SystemExit("Duplicate timestamp guard failed.")

          if integrity.get("allOHLCValid") is not True:
              raise SystemExit("OHLC validity guard failed.")

          print("V25.7 frozen dataset verification: PASS")
          print("Canonical rows:", data["counts"]["canonicalRows"])
          PY

      - name: Rebuild frozen V25.10 learning dataset
        shell: bash
        run: |
          node .github/scripts/v25_10-learning-dataset-freeze.js

      - name: Verify frozen V25.10 learning dataset
        shell: bash
        run: |
          set -euo pipefail
          test -s v25_10_learning_dataset.json

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          dataset = data.get("learningDataset", {})
          audit = data.get("learningRecordAudit", {})
          guard = data.get("guard", {})

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("V25.10 freeze did not complete.")

          if dataset.get("frozen") is not True:
              raise SystemExit("V25.10 frozen flag is not true.")

          if dataset.get("rowCount") != 7791:
              raise SystemExit(
                  f"Unexpected V25.10 row count: {dataset.get('rowCount')}"
              )

          if dataset.get("featureCount") != 19:
              raise SystemExit(
                  f"Unexpected V25.10 feature count: {dataset.get('featureCount')}"
              )

          if audit.get("datasetInvalidRows") != 0:
              raise SystemExit("Invalid V25.10 dataset rows detected.")

          if audit.get("datasetDuplicateRows") != 0:
              raise SystemExit("Duplicate V25.10 dataset rows detected.")

          for key in [
              "learningEngineCalled",
              "candidateDiscovery",
              "validation",
              "oos",
              "strategyModified",
              "realOrders"
          ]:
              if guard.get(key) is not False:
                  raise SystemExit(f"V25.10 guard failed: {key}")

          print("V25.10 frozen learning dataset verification: PASS")
          print("Rows:", dataset["rowCount"])
          print("Features:", dataset["featureCount"])
          print("SHA256:", dataset.get("sha256"))
          PY

      # V25.32 itself is deterministic from frozen V25.10.
      # This avoids dependency on any transient V25.32 artifact.
      - name: Run V25.32 controlled regime transition research
        shell: bash
        run: |
          node .github/scripts/v25_32-controlled-regime-transition-research.js

      - name: Verify V25.32 source
        shell: bash
        run: |
          set -euo pipefail
          test -s v25_32_controlled_regime_transition_research.json

          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "v25_32_controlled_regime_transition_research.json",
              "utf8"
            )
          );

          if (
            data.version !== "V25.32" ||
            data.status !==
              "CONTROLLED_REGIME_TRANSITION_RESEARCH_COMPLETE"
          ) {
            throw new Error("V25.32 source result is invalid.");
          }

          if (
            !data.dataset ||
            data.dataset.requiredVersion !== "V25.10"
          ) {
            throw new Error(
              "V25.32 does not identify the frozen V25.10 source."
            );
          }

          if (
            !Array.isArray(data.transitionWindows) ||
            data.transitionWindows.length < 1
          ) {
            throw new Error(
              "V25.32 transitionWindows are missing."
            );
          }

          const prohibited = [
            ["featureSelection", false],
            ["thresholdOptimization", false],
            ["parameterOptimization", false],
            ["pAndLRanking", false],
            ["strategyPromotion", false],
            ["predictiveClaim", false],
            ["liveTrading", false],
            ["brokerOrders", false]
          ];

          for (const [key, expected] of prohibited) {
            if (data.conclusion?.[key] !== expected) {
              throw new Error(
                `V25.32 control failed: ${key}`
              );
            }
          }

          console.log(
            "V25.32 source verification: PASS"
          );
          console.log(
            "Transitions:",
            data.transitionAnalysis.transitionCount
          );
          console.log(
            "Direction-changing transitions:",
            data.transitionAnalysis.directionChangedTransitionCount
          );
          NODE

      - name: Run V25.33 controlled transition direction attribution
        shell: bash
        run: |
          node .github/scripts/v25_33-controlled-transition-direction-attribution.js

      - name: Verify V25.33 result
        shell: bash
        run: |
          set -euo pipefail
          test -s v25_33_controlled_transition_direction_attribution.json

          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "v25_33_controlled_transition_direction_attribution.json",
              "utf8"
            )
          );

          if (
            data.version !== "V25.33" ||
            data.status !==
              "CONTROLLED_TRANSITION_DIRECTION_ATTRIBUTION_COMPLETE"
          ) {
            throw new Error("V25.33 result is invalid.");
          }

          const controls = data.controls || {};

          for (const key of [
            "featureSelection",
            "thresholdSearch",
            "parameterSearch",
            "optimization",
            "pAndLRanking",
            "cherryPicking",
            "strategyPromotion",
            "predictiveClaim",
            "liveTrading",
            "brokerOrders"
          ]) {
            if (controls[key] !== false) {
              throw new Error(
                `V25.33 research control failed: ${key}`
              );
            }
          }

          const attribution = data.attribution || {};

          if (
            !attribution.BULL_TO_BEAR ||
            !attribution.BEAR_TO_BULL
          ) {
            throw new Error(
              "V25.33 direction attribution groups are incomplete."
            );
          }

          if (
            data.transitionUniverse?.coverageCheck !== true
          ) {
            throw new Error(
              "V25.33 transition coverage check failed."
            );
          }

          console.log("V25.33 result verification: PASS");
          NODE

      - name: Print V25.33 summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "v25_33_controlled_transition_direction_attribution.json",
              "utf8"
            )
          );

          console.log("=== TRADEMIND PRO V25.33 ===");
          console.log("Status:", data.status);
          console.log(
            "Classification:",
            data.descriptiveClassification
          );
          console.log(
            "Source transitions:",
            data.transitionUniverse.sourceTransitionCount
          );
          console.log(
            "Directional transitions:",
            data.transitionUniverse.directionalTransitionCount
          );
          console.log(
            "BULL -> BEAR:",
            JSON.stringify(data.attribution.BULL_TO_BEAR)
          );
          console.log(
            "BEAR -> BULL:",
            JSON.stringify(data.attribution.BEAR_TO_BULL)
          );
          console.log(
            "Feature selection:",
            data.controls.featureSelection
          );
          console.log(
            "Optimization:",
            data.controls.optimization
          );
          console.log(
            "Strategy promotion:",
            data.controls.strategyPromotion
          );
          NODE

      - name: Upload V25.33 research JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-33-controlled-transition-direction-attribution
          path: v25_33_controlled_transition_direction_attribution.json
          if-no-files-found: error

      - name: Save V25.33 progress checkpoint
        shell: bash
        run: |
          cat > v25_33_progress_checkpoint.json <<'JSON'
          {
            "version": "V25.33",
            "status": "COMPLETE",
            "stage": "CONTROLLED_TRANSITION_DIRECTION_ATTRIBUTION",
            "source": "V25.32_REBUILT_FROM_FROZEN_V25.10",
            "nextStage": "V25.34_CONTROLLED_TRANSITION_CONTEXT_RESEARCH",
            "featureSelection": false,
            "optimization": false,
            "strategyPromotion": false,
            "liveTrading": false,
            "brokerOrders": false
          }
          JSON

      - name: Upload V25.33 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-33-progress-checkpoint
          path: v25_33_progress_checkpoint.json
          if-no-files-found: error
