name: System Phase 10 - Bounded Paper Experience Accumulation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  phase-10:
    runs-on: ubuntu-latest

    steps:
      - name: Start Phase 10
        run: echo "Starting bounded paper experience accumulation"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Phase 10 source
        run: node --check system-development/phase-10-bounded-paper-experience-accumulation.js

      - name: Locate latest successful Phase 8 run
        id: phase8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "system-development-phase-8-FIXED-V2.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Phase 8 model
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.phase8.outputs.run_id }}
        run: |
          set -euo pipefail

          rm -rf phase8-artifact
          mkdir phase8-artifact

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name system-phase-8-bounded-paper-trading-model \
            --dir phase8-artifact

          mkdir -p system-development/data

          mapfile -t FILES < <(
            find phase8-artifact -type f \
              -name "phase-8-paper-trading-model.json" -print
          )

          test "${#FILES[@]}" -eq 1

          cp "${FILES[0]}" \
            system-development/data/phase-8-paper-trading-model.json

      - name: Verify Phase 8 boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync(
              "system-development/data/phase-8-paper-trading-model.json",
              "utf8"
            )
          );

          if (
            d.version !==
            "SYSTEM_PHASE_8_BOUNDED_PAPER_TRADING_MODEL_V1"
          ) {
            throw new Error("Unexpected Phase 8 version");
          }

          if (d.status !== "PAPER_MODEL_CONSTRUCTED") {
            throw new Error("Phase 8 model is not constructed");
          }

          if (d.candidate?.id !== "CANDIDATE_BASELINE_V1") {
            throw new Error("Unexpected Phase 8 candidate ID");
          }

          if (d.candidate?.oosStatus !== "NOT_VALIDATED") {
            throw new Error(
              "Phase 7 NOT_VALIDATED was not preserved"
            );
          }

          if (
            d.paperContract?.executionMode !== "PAPER_ONLY" ||
            d.paperContract?.realTrading !== false ||
            d.paperContract?.brokerOrders !== false
          ) {
            throw new Error(
              "Phase 8 paper safety boundary failed"
            );
          }

          if (
            d.learningBoundary?.learnerUpdate !== false ||
            d.learningBoundary?.strategyMutation !== false ||
            d.learningBoundary?.promotion !== false
          ) {
            throw new Error(
              "Phase 8 learning boundary failed"
            );
          }

          console.log(
            "PHASE_8_ARTIFACT_AND_BOUNDARY_VERIFIED"
          );
          NODE

      # Phase 10 requires a real-looking, internally coherent completed candle
      # for the CI smoke test. This is explicitly CONTROLLED_SMOKE and is never
      # represented as live-market evidence.
      - name: Create controlled Phase 10 smoke observation
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const path =
            "system-development/data/phase-10-paper-observations.json";

          const timestamp = new Date(
            "2026-08-14T09:20:00.000Z"
          ).toISOString();

          const observation = {
            source: "CONTROLLED_SMOKE",
            timestamp,
            instrument: "NIFTY 50",
            timeframe: "5m",
            candle: {
              o: 25000,
              h: 25020,
              l: 24990,
              c: 25010
            },
            decision: {
              action: "NO_TRADE",
              confidence: null,
              rationale: "CONTROLLED_PHASE_10_SMOKE_ONLY"
            }
          };

          fs.writeFileSync(
            path,
            JSON.stringify([observation], null, 2) + "\n"
          );

          console.log(
            "CONTROLLED_PHASE_10_SMOKE_INPUT_CREATED"
          );
          NODE

      - name: Verify Phase 10 input exists
        run: test -f system-development/data/phase-10-paper-observations.json

      - name: Verify Phase 10 input is controlled smoke only
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const rows = JSON.parse(
            fs.readFileSync(
              "system-development/data/phase-10-paper-observations.json",
              "utf8"
            )
          );

          if (!Array.isArray(rows) || rows.length !== 1) {
            throw new Error(
              "Expected exactly one controlled Phase 10 smoke observation"
            );
          }

          const row = rows[0];

          if (row.source !== "CONTROLLED_SMOKE") {
            throw new Error(
              "Phase 10 CI input is not explicitly controlled smoke data"
            );
          }

          if (
            !row.timestamp ||
            row.timestamp.includes("REPLACE_WITH") ||
            Number.isNaN(Date.parse(row.timestamp))
          ) {
            throw new Error("Controlled smoke timestamp is invalid");
          }

          const { o, h, l, c } = row.candle || {};

          for (const [name, value] of Object.entries({ o, h, l, c })) {
            if (!Number.isFinite(value) || value <= 0) {
              throw new Error(
                `Controlled smoke candle ${name} is invalid`
              );
            }
          }

          if (h < Math.max(o, c)) {
            throw new Error("Controlled smoke high is invalid");
          }

          if (l > Math.min(o, c)) {
            throw new Error("Controlled smoke low is invalid");
          }

          if (
            row.decision?.rationale !==
            "CONTROLLED_PHASE_10_SMOKE_ONLY"
          ) {
            throw new Error(
              "Controlled smoke rationale is invalid"
            );
          }

          console.log(
            "PHASE_10_CONTROLLED_SMOKE_INPUT_VERIFIED"
          );
          NODE

      - name: Run Phase 10 bounded experience capture
        run: node system-development/phase-10-bounded-paper-experience-accumulation.js

      - name: Verify Phase 10 result
        run: |
          test -f system-development/data/phase-10-paper-experience.json

          node - <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync(
              "system-development/data/phase-10-paper-experience.json",
              "utf8"
            )
          );

          if (d.status !== "PAPER_EXPERIENCE_CAPTURED") {
            throw new Error("Unexpected Phase 10 status");
          }

          if (d.candidate?.oosStatus !== "NOT_VALIDATED") {
            throw new Error(
              "Phase 7 NOT_VALIDATED was not preserved"
            );
          }

          if (
            d.safety?.realTrading !== false ||
            d.safety?.brokerOrders !== false ||
            d.safety?.learnerUpdates !== false ||
            d.safety?.promotion !== false
          ) {
            throw new Error(
              "Phase 10 safety boundary failed"
            );
          }

          console.log(JSON.stringify(d, null, 2));
          NODE

      - name: Print Phase 10 summary
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync(
              "system-development/data/phase-10-paper-experience.json",
              "utf8"
            )
          );

          console.log("=== TRADEMIND PRO PHASE 10 ===");
          console.log("STATUS:", d.status);
          console.log("NEW OBSERVATIONS:", d.capture.newObservations);
          console.log("NEW ENTRIES:", d.capture.newEntries);
          console.log("NEW EXITS:", d.capture.newExits);
          console.log(
            "TOTAL CLOSED TRADES:",
            d.capture.cumulativeClosedTrades
          );
          console.log(
            "CUMULATIVE GROSS PNL:",
            d.capture.cumulativeGrossPnl
          );
          console.log(
            "OPEN POSITION:",
            d.capture.openPosition
          );
          console.log(
            "REAL TRADING:",
            d.safety.realTrading
          );
          console.log(
            "LEARNER UPDATE:",
            d.safety.learnerUpdates
          );
          NODE

      - name: Upload Phase 10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-bounded-paper-experience
          path: |
            system-development/data/phase-10-paper-experience.json
            system-development/data/phase-10-paper-experience-ledger.jsonl
            system-development/checkpoints/phase-10-paper-position-state.json
            system-development/checkpoints/phase-10-paper-experience-checkpoint.json

      - name: Save Phase 10 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            system-development/data/phase-10-paper-experience.json \
            system-development/data/phase-10-paper-experience-ledger.jsonl \
            system-development/checkpoints/phase-10-paper-position-state.json \
            system-development/checkpoints/phase-10-paper-experience-checkpoint.json

          git diff --cached --quiet || \
            git commit -m "Add Phase 10 paper experience checkpoint"

      - name: Push Phase 10 checkpoint
        run: git push

      - name: Final safety assertion
        run: |
          test ! -f system-development/data/real-orders.json
          echo "Phase 10 safety assertion passed: PAPER ONLY"
