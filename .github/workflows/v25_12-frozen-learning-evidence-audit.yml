name: V25.12 Frozen Learning Evidence Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen V25.10 learning dataset
        uses: actions/download-artifact@v4
        with:
          name: v25-10-learning-dataset
          path: .
          repository: ${{ github.repository }}
          run-id: 31714266120
          github-token: ${{ github.token }}

      - name: Verify frozen V25.10 dataset
        run: |
          echo "Checking frozen V25.10 learning dataset..."

          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not found."
            echo "Files present:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Frozen V25.10 dataset found."
          wc -c v25_10_learning_dataset.json

      - name: Run V25.12 frozen learning evidence audit
        run: |
          node .github/scripts/v25_12-frozen-learning-evidence-audit.js

      - name: Print V25.12 evidence audit summary
        run: |
          if [ -f v25_12_frozen_learning_evidence_audit.json ]; then
            cat v25_12_frozen_learning_evidence_audit.json
          else
            echo "V25.12 evidence audit JSON was not generated."
            exit 1
          fi

      - name: Verify V25.12 audit result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_12_frozen_learning_evidence_audit.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(json.dumps({
              "version": data.get("version"),
              "status": data.get("status"),
              "datasetRows": data.get("source", {}).get("datasetRows"),
              "featureCount": data.get("source", {}).get("featureCount"),
              "futureDirectionCounts": data.get("outcome", {}).get("futureDirectionCounts"),
              "auditPass": data.get("verdict", {}).get("auditPass"),
              "descriptiveOnly": data.get("verdict", {}).get("descriptiveOnly"),
              "noOptimization": data.get("verdict", {}).get("noOptimization"),
              "noCandidateDiscovery": data.get("verdict", {}).get("noCandidateDiscovery"),
              "noStrategyModification": data.get("verdict", {}).get("noStrategyModification")
          }, indent=2))

          if data.get("status") != "EVIDENCE_AUDIT_COMPLETE":
              raise SystemExit(
                  "V25.12 evidence audit did not complete."
              )

          verdict = data.get("verdict", {})

          if verdict.get("auditPass") is not True:
              raise SystemExit(
                  "V25.12 auditPass is not true."
              )

          if verdict.get("descriptiveOnly") is not True:
              raise SystemExit(
                  "V25.12 was not descriptive-only."
              )

          if verdict.get("noOptimization") is not True:
              raise SystemExit(
                  "Optimization guard failed."
              )

          if verdict.get("noCandidateDiscovery") is not True:
              raise SystemExit(
                  "Candidate-discovery guard failed."
              )

          if verdict.get("noStrategyModification") is not True:
              raise SystemExit(
                  "Strategy-modification guard failed."
              )

          print(
              "V25.12 frozen learning evidence audit: PASS"
          )
          PY

      - name: Upload V25.12 evidence audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-12-frozen-learning-evidence-audit
          path: v25_12_frozen_learning_evidence_audit.json
          if-no-files-found: error
