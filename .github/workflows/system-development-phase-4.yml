Phase 4 failure fix

Root cause:
Phase 3 writes outcome.exitTimestamp as an epoch-millisecond number.
Phase 4 expected every exitTimestamp to be an ISO string and called
Date.parse() on the numeric value after converting it to a required string.

Fix:
Phase 4 now accepts:
- ISO timestamps
- epoch milliseconds
- epoch seconds

All accepted timestamps are canonicalized to ISO strings in the Phase 4
learning-ready output.

No strategy logic, thresholds, learning, optimization, broker integration,
or trading behavior was changed.
