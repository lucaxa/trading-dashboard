name: V25.29 Controlled Hypothesis Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download frozen V25.7 full S5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-7-full_s5-import
          path: .
          repository: ${{ github.repository }}
          run-id: 31687848244
          github-token: ${{ github.token }}

      - name: Verify frozen V25.7 dataset
        run: |
          if [ ! -f v25_7_import.json ]; then
            echo "ERROR: v25_7_import.json was not found."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_7_import.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "IMPORT_COMPLETE":
              raise SystemExit("V25.7 dataset is not IMPORT_COMPLETE.")

          if data.get("mode") != "full_s5":
              raise SystemExit("V25.7 dataset is not full_s5.")

          if data.get("counts", {}).get("canonicalRows") != 9385:
              raise SystemExit("Unexpected V25.7 canonical row count.")

          integrity = data.get("integrity", {})

          if integrity.get("chronological") is not True:
              raise SystemExit("Chronological integrity failed.")

          if integrity.get("duplicateTimestamps") is not False:
              raise SystemExit("Duplicate timestamp guard failed.")

          if integrity.get("allOHLCValid") is not True:
              raise SystemExit("OHLC validity guard failed.")

          print("V25.7 frozen dataset verification: PASS")
          PY

      - name: Rebuild frozen V25.10 learning dataset
        run: |
          node .github/scripts/v25_10-learning-dataset-freeze.js

      - name: Verify frozen V25.10 learning dataset
        run: |
          if [ ! -f v25_10_learning_dataset.json ]; then
            echo "ERROR: v25_10_learning_dataset.json was not generated."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("v25_10_learning_dataset.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          dataset = data.get("learningDataset", {})
          audit = data.get("learningRecordAudit", {})
          guard = data.get("guard", {})

          if data.get("status") != "DATASET_FREEZE_COMPLETE":
              raise SystemExit("V25.10 freeze did not complete.")

          if dataset.get("frozen") is not True:
              raise SystemExit("V25.10 frozen flag is not true.")

          if dataset.get("rowCount") != 7791:
              raise SystemExit(
                  f"Unexpected V25.10 row count: {dataset.get('rowCount')}"
              )

          if dataset.get("featureCount") != 19:
              raise SystemExit(
                  f"Unexpected V25.10 feature count: {dataset.get('featureCount')}"
              )

          if audit.get("datasetInvalidRows") != 0:
              raise SystemExit("Invalid V25.10 dataset rows detected.")

          if audit.get("datasetDuplicateRows") != 0:
              raise SystemExit("Duplicate V25.10 dataset rows detected.")

          for key in [
              "learningEngineCalled",
              "candidateDiscovery",
              "validation",
              "oos",
              "strategyModified",
              "realOrders"
          ]:
              if guard.get(key) is not False:
                  raise SystemExit(f"V25.10 guard failed: {key}")

          print("V25.10 frozen learning dataset verification: PASS")
          print("Rows:", dataset.get("rowCount"))
          print("Features:", dataset.get("featureCount"))
          print("SHA256:", dataset.get("sha256"))
          PY

      - name: Run V25.18 mathematical identity evidence
        run: |
          node .github/scripts/v25_18-stable-evidence-mathematical-identity-audit.js

      - name: Run V25.19 volatility conditioning evidence
        run: |
          node .github/scripts/v25_19-stable-evidence-volatility-conditioning-audit.js

      - name: Run V25.20 persistence evidence
        run: |
          node .github/scripts/v25_20-stable-evidence-volatility-conditioned-persistence-audit.js

      - name: Run V25.21 magnitude evidence
        run: |
          node .github/scripts/v25_21-stable-evidence-volatility-conditioned-magnitude-audit.js

      - name: Run V25.22 ATR decomposition evidence
        run: |
          node .github/scripts/v25_22-stable-evidence-atr-normalization-decomposition-audit.js

      - name: Run V25.23 extreme ATR tail evidence
        run: |
          node .github/scripts/v25_23-stable-evidence-extreme-atr-tail-integrity-audit.js

      - name: Run V25.24 direction consistency evidence
        run: |
          node .github/scripts/v25_24-stable-evidence-atr-normalization-direction-consistency-audit.js

      - name: Run V25.25 HIGH-Q4 temporal concentration evidence
        run: |
          node .github/scripts/v25_25-stable-evidence-high-q4-temporal-concentration-audit.js

      - name: Run V25.26 HIGH-Q4 regime-state attribution evidence
        run: |
          node .github/scripts/v25_26-stable-evidence-high-q4-regime-state-attribution-audit.js

      - name: Verify complete V25.18-V25.26 evidence chain
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "v25_18_stable_evidence_mathematical_identity_audit.json",
              "v25_19_stable_evidence_volatility_conditioning_audit.json",
              "v25_20_stable_evidence_volatility_conditioning_persistence_audit.json",
              "v25_21_stable_evidence_volatility_conditioning_magnitude_audit.json",
              "v25_22_stable_evidence_atr_normalization_decomposition_audit.json",
              "v25_23_stable_evidence_extreme_atr_tail_integrity_audit.json",
              "v25_24_stable_evidence_atr_normalization_direction_consistency_audit.json",
              "v25_25_stable_evidence_high_q4_temporal_concentration_audit.json",
              "v25_26_stable_evidence_high_q4_regime_state_attribution_audit.json"
          ]

          for name in files:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Missing evidence artifact: {name}")

              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if data.get("auditPass") is not True:
                  raise SystemExit(f"{name}: auditPass is not true.")

              policy = data.get("policy", {})

              if policy.get("sourceFrozen") is not True:
                  raise SystemExit(f"{name}: sourceFrozen is not true.")

              for key in [
                  "datasetModified",
                  "featureEngineering",
                  "featureSelection",
                  "candidateDiscovery",
                  "strategyDiscovery",
                  "optimization",
                  "modelFitting",
                  "strategyValidation",
                  "strategyModified",
                  "realOrders"
              ]:
                  if policy.get(key) is not False:
                      raise SystemExit(f"{name}: policy.{key} is not false.")

          print("V25.18-V25.26 evidence-chain verification: PASS")
          PY

      - name: Run V25.29 controlled hypothesis research
        run: |
          node .github/scripts/v25_29-controlled-hypothesis-research.js

      - name: Print V25.29 research result
        run: |
          if [ ! -f v25_29_controlled_hypothesis_research.json ]; then
            echo "V25.29 output JSON was not generated."
            exit 1
          fi

          cat v25_29_controlled_hypothesis_research.json

      - name: Verify V25.29 research result
        run: |
          python3 - <<'PY'
          import json

          with open(
              "v25_29_controlled_hypothesis_research.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("success") is not True:
              raise SystemExit("V25.29 success flag is not true.")

          if data.get("status") != "CONTROLLED_HYPOTHESIS_RESEARCH_COMPLETE":
              raise SystemExit("V25.29 did not complete.")

          if data.get("auditPass") is not True:
              raise SystemExit("V25.29 auditPass is not true.")

          source = data.get("source", {})

          if source.get("datasetRows") != 7791:
              raise SystemExit("Unexpected V25.29 dataset row count.")

          if source.get("featureCount") != 19:
              raise SystemExit("Unexpected V25.29 feature count.")

          if source.get("datasetFrozen") is not True:
              raise SystemExit("V25.29 source is not frozen.")

          policy = data.get("policy", {})

          for key in [
              "sourceFrozen",
              "datasetModified",
          ]:
              if key == "sourceFrozen":
                  if policy.get(key) is not True:
                      raise SystemExit("V25.29 sourceFrozen guard failed.")
              else:
                  if policy.get(key) is not False:
                      raise SystemExit(f"V25.29 policy.{key} guard failed.")

          for key in [
              "featureEngineering",
              "featureSelection",
              "candidateDiscovery",
              "strategyDiscovery",
              "optimization",
              "modelFitting",
              "strategyValidation",
              "strategyModified",
              "realOrders"
          ]:
              if policy.get(key) is not False:
                  raise SystemExit(f"V25.29 policy.{key} guard failed.")

          protocol = data.get("researchProtocol", {})

          for key in [
              "preregistered"
          ]:
              if protocol.get(key) is not True:
                  raise SystemExit(f"V25.29 protocol.{key} guard failed.")

          for key in [
              "thresholdSearch",
              "parameterSearch",
              "rankingByPnL",
              "cherryPicking",
              "newFeatures",
              "modelFitting",
              "strategyTesting"
          ]:
              if protocol.get(key) is not False:
                  raise SystemExit(f"V25.29 protocol.{key} guard failed.")

          evidence = data.get("evidenceChain", {})

          if evidence.get("auditCount") != 9:
              raise SystemExit("V25.29 evidence audit count is not 9.")

          if evidence.get("expectedAuditCount") != 9:
              raise SystemExit("V25.29 expected audit count is not 9.")

          if evidence.get("complete") is not True:
              raise SystemExit("V25.29 evidence chain is incomplete.")

          conclusion = data.get("researchConclusion", {})

          if conclusion.get("decision") != "NO_FEATURE_SELECTION":
              raise SystemExit("V25.29 made an unexpected feature-selection decision.")

          guards = data.get("guards", {})

          for key in [
              "learningEngineCalled",
              "featureSelection",
              "candidateDiscovery",
              "strategyDiscovery",
              "optimization",
              "modelFitting",
              "validation",
              "oos",
              "strategyModified",
              "realOrders"
          ]:
              if guards.get(key) is not False:
                  raise SystemExit(f"V25.29 guard failed: {key}")

          print("V25.29 controlled hypothesis research verification: PASS")
          PY

      - name: Upload V25.29 research JSON
        uses: actions/upload-artifact@v4
        with:
          name: v25-29-controlled-hypothesis-research
          path: v25_29_controlled_hypothesis_research.json
          if-no-files-found: error

      - name: Save V25.29 progress checkpoint
        run: |
          cat > v25_29_progress_checkpoint.json <<'EOF'
          {
            "project": "TradeMind Pro",
            "stage": "V25.29",
            "status": "CONTROLLED_HYPOTHESIS_RESEARCH_COMPLETE",
            "source": "v25_10_learning_dataset.json rebuilt from frozen V25.7 full_s5 artifact",
            "sourceFrozen": true,
            "datasetModified": false,
            "datasetRows": 7791,
            "featureCount": 19,
            "paperOnly": true,
            "realOrders": false,
            "featureEngineering": false,
            "featureSelection": false,
            "candidateDiscovery": false,
            "strategyDiscovery": false,
            "optimization": false,
            "modelFitting": false,
            "strategyValidation": false,
            "strategyModified": false,
            "preregistered": true,
            "assessmentVocabulary": [
              "SUPPORTED_DESCRIPTIVELY",
              "MIXED_DESCRIPTIVE_EVIDENCE",
              "NOT_ESTABLISHED",
              "UNABLE_TO_ASSESS"
            ],
            "evidenceChain": [
              "V25.18",
              "V25.19",
              "V25.20",
              "V25.21",
              "V25.22",
              "V25.23",
              "V25.24",
              "V25.25",
              "V25.26"
            ],
            "gate": "V25.27",
            "researchSpecification": "V25.28",
            "decision": "NO_FEATURE_SELECTION",
            "nextDecisionPoint": "Human review of V25.29 hypothesis evidence before any separately authorized research protocol is created."
          }
          EOF

      - name: Upload V25.29 progress checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v25-29-progress-checkpoint
          path: v25_29_progress_checkpoint.json
          if-no-files-found: error
